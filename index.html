<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Character Sheet</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 10px;
      background: #2c3e50;
      color: white;
      border-radius: 8px;
    }
    h3 { margin-top: 0; }
    .mana-bar {
      background: #34495e;
      padding: 5px;
      border-radius: 4px;
      margin-bottom: 15px;
      text-align: center;
      font-weight: bold;
    }
    .mana-ok { color: #2ecc71; }
    .mana-low { color: #e74c3c; }
    button {
      display: block;
      width: 100%;
      margin-bottom: 8px;
      padding: 8px;
      cursor: pointer;
      background: white;
      border: none;
      border-radius: 4px;
      text-align: left;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #no-token {
      text-align: center;
      color: #7f8c8d;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h3 id="char-name">Загрузка...</h3>
  
  <div class="mana-bar" id="mana-display">Мана: 0 / 0</div>

  <!-- Кнопки способностей -->
  <button data-cost="5" data-name="Огненный шар">Огненный шар (5 маны)</button>
  <button data-cost="10" data-name="Молния">Молния (10 маны)</button>
  <button data-cost="3" data-name="Лечение">Лечение (3 маны)</button>

  <p id="no-token">Выберите токен на сцене, чтобы увидеть способности</p>

  <script src="script.js"></script>
</body>
</html>
