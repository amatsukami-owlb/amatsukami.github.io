<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Character Sheet Panel</title>
    <script src="obr-sdk.js"></script>
    <style>
        body { font-family: sans-serif; background: #222; color: #fff; padding: 15px; margin: 0; box-sizing: border-box; }
        .resource-bar { background: #444; border-radius: 5px; padding: 10px; text-align: center; margin-bottom: 15px; font-weight: bold; }
        .ability-btn { display: block; width: 100%; padding: 10px; margin: 8px 0; border: none; border-radius: 4px; background: #007bff; color: white; cursor: pointer; font-size: 14px; }
        .ability-btn:disabled { background: #555; color: #888; cursor: not-allowed; }
        .controls-group { background: #2a2a2a; padding: 12px; border-radius: 6px; border: 1px solid #444; margin-top: 15px; }
        .input-inline { display: flex; gap: 8px; margin-bottom: 10px; }
        select, input { width: 100%; padding: 8px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; box-sizing: border-box; margin-bottom: 10px; }
        .input-inline input { margin-bottom: 0; }
        .input-inline button { margin: 0; padding: 0 15px; white-space: nowrap; width: auto; }
        .token-header { border-bottom: 1px solid #444; padding-bottom: 8px; margin-bottom: 12px; color: #ffc107; }
        .setup-screen { text-align: center; padding-top: 40px; }
    </style>
</head>
<body>

    <!-- ЭКРАН ВХОДА ДЛЯ ИГРОКА -->
    <div id="player-setup-view" style="display: none;" class="setup-screen">
        <h3>Введите имя вашего персонажа</h3>
        <p style="color: #aaa; font-size: 14px;">(Например: Mira или Bolt)</p>
        <input type="text" id="character-name-input" placeholder="Имя персонажа...">
        <button id="login-char-btn" class="ability-btn">Войти в панель</button>
    </div>

    <!-- ГЛАВНЫЙ ЭКРАН ИГРОКА -->
    <div id="player-main-view" style="display: none;">
        <h2 id="char-display-name" class="token-header">Имя Персонажа</h2>
        <h3 id="class-title">Класс не назначен</h3>
        <div class="resource-bar" id="resource-display">Ресурс: —</div>
        <div id="abilities-list"></div>
    </div>

    <!-- ЭКРАН ГЕЙМ-МАСТЕРА (GM) -->
    <div id="gm-view" style="display: none;">
        <h3>Панель управления Мастера</h3>
        <div class="controls-group">
            <label for="gm-char-select"><b>Выберите персонажа для настройки:</b></label>
            <select id="gm-char-select"></select>
            
            <div style="background: #333; padding: 10px; border-radius: 4px; margin: 10px 0; font-size: 14px;">
                Текущий статус: <span id="gm-status-label" style="color: #ffc107; font-weight: bold;">Загрузка...</span>
            </div>

            <label for="class-select">Назначить класс:</label>
            <select id="class-select">
                <option value="none">Без класса</option>
                <option value="warrior">Воин (Выносливость)</option>
                <option value="mage">Маг (Мана)</option>
            </select>
            <button id="assign-btn" class="ability-btn">Установить класс и сбросить ресурс</button>
            
            <label>Изменить текущий ресурс вручную:</label>
            <div class="input-inline">
                <input type="number" id="manual-resource-input" placeholder="Значение..." min="0">
                <button id="save-resource-btn" class="ability-btn">ОК</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
