<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Class Abilities</title>
    <!-- Подключаем SDK Owlbear Rodeo -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: sans-serif; background: #222; color: #fff; padding: 15px; margin: 0; }
        .resource-bar { background: #444; border-radius: 5px; padding: 10px; text-align: center; margin-bottom: 15px; font-weight: bold; }
        .ability-btn { display: block; width: 100%; padding: 10px; margin: 8px 0; border: none; border-radius: 4px; background: #007bff; color: white; cursor: pointer; font-size: 14px; }
        .ability-btn:disabled { background: #555; color: #888; cursor: not-allowed; }
        .gm-panel { border-top: 1px solid #444; margin-top: 20px; padding-top: 10px; display: none; }
        select { width: 100%; padding: 5px; background: #333; color: white; border: 1px solid #555; }
    </style>
</head>
<body>

    <div id="player-view">
        <h3 id="class-title">Класс не назначен</h3>
        <div class="resource-bar" id="resource-display">Ресурс: 0 / 0</div>
        <div id="abilities-list"></div>
    </div>

    <!-- Панель управления мастера (скрыта для игроков) -->
    <div id="gm-panel" class="gm-panel">
        <h4>Панель Мастера (Назначить класс)</h4>
        <label for="player-select">Игрок:</label>
        <select id="player-select"></select>
        <br/><br/>
        <label for="class-select">Класс:</label>
        <select id="class-select">
            <option value="none">Без класса</option>
            <option value="warrior">Воин (Выносливость)</option>
            <option value="mage">Маг (Мана)</option>
        </select>
        <br/><br/>
        <button id="assign-btn" class="ability-btn">Назначить класс и сбросить ресурс</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
